<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sticky Notes</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Times New Roman',Times,serif;
  background:linear-gradient(135deg,#87ceeb 0%,#dfefff 45%,#f7e6c4 100%);
  color:#2f3b4a;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:40px 20px;
}
.sticky-section{
  display:flex;
  flex-direction:column;
  gap:16px;
  width:100%;
  max-width:380px;
  z-index:10;
}
.sticky-note-box{
  padding:16px;
  border-radius:16px;
  background:rgba(255,255,255,.24);
  backdrop-filter:blur(12px);
  box-shadow:0 10px 24px rgba(0,0,0,.14);
}
.sticky-note-box p{
  margin:0 0 12px 0;
  font-weight:700;
  color:#fff;
  text-align:center;
  font-size:18px;
  text-shadow:0 2px 6px rgba(0,0,0,.18);
}
.sticky-note-box textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:none;
  border-radius:10px;
  resize:vertical;
  font-family:'Times New Roman',Times,serif;
  font-weight:700;
  color:#000;
  margin-bottom:12px;
  background:#fff59d;
  min-height:80px;
  font-size:16px;
  line-height:1.4;
}
.sticky-note-box textarea[data-color="pink"]{background:#f8c8dc}
.sticky-note-box textarea[data-color="blue"]{background:#cfe8ff}
.sticky-note-box textarea[data-color="green"]{background:#d8f5d0}
.sticky-note-box .color-picker-row{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:12px;
  justify-content:center;
}
.sticky-note-box .color-pill{
  width:32px;
  height:32px;
  border-radius:50%;
  border:2px solid #fff;
  cursor:pointer;
  transition:transform .2s ease;
  padding:0;
}
.sticky-note-box .color-pill:hover{transform:scale(1.08)}
.sticky-note-box .color-pill.active{outline:2px solid #333}
.sticky-note-box .color-pill.yellow{background:#fff59d}
.sticky-note-box .color-pill.pink{background:#f8c8dc}
.sticky-note-box .color-pill.blue{background:#cfe8ff}
.sticky-note-box .color-pill.green{background:#d8f5d0}
.sticky-note-box .button-group{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.sticky-note-box .add-note-btn{
  width:100%;
  padding:11px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,#ffffff,#f4f6ff);
  color:#2f3b4a;
  font-weight:700;
  cursor:pointer;
  font-size:14px;
  transition:transform .2s ease, box-shadow .2s ease;
}
.sticky-note-box .add-note-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 18px rgba(0,0,0,.12);
}
.sticky-note-box .add-note-btn.secondary{
  background:linear-gradient(135deg,#2f4f4f,#456a6a);
  color:#fff;
}
.sticky-note-box .add-note-btn.danger{
  background:rgba(217,83,79,.85);
  color:#fff;
}
.search-input{
  width:100%;
  box-sizing:border-box;
  padding:9px 12px;
  border:1px solid rgba(255,255,255,.5);
  border-radius:999px;
  background:rgba(255,255,255,.7);
  font-family:'Times New Roman',Times,serif;
  font-size:14px;
  margin-bottom:10px;
  outline:none;
}
.search-input:focus{
  background:#fff;
}
.sticky-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.sticky-item{
  width:100%;
  padding:12px 34px 12px 12px;
  border-radius:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.12);
  font-size:16px;
  white-space:pre-wrap;
  cursor:text;
  transition:transform .35s ease, opacity .35s ease;
  position:relative;
  font-family:'Times New Roman',Times,serif;
  color:#000;
  font-weight:700;
  border:1px solid rgba(0,0,0,.06);
  line-height:1.4;
  min-height:72px;
  height:auto;
  overflow-wrap:anywhere;
}
.sticky-item[data-color="yellow"]{background:#fff59d}
.sticky-item[data-color="pink"]{background:#f8c8dc}
.sticky-item[data-color="blue"]{background:#cfe8ff}
.sticky-item[data-color="green"]{background:#d8f5d0}
.sticky-note-text{
  outline:none;
  min-height:48px;
  height:auto;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.sticky-menu-button{
  position:absolute;
  top:8px;
  right:8px;
  border:none;
  background:rgba(0,0,0,.12);
  color:#333;
  border-radius:50%;
  width:26px;
  height:26px;
  cursor:pointer;
  display:grid;
  place-items:center;
  font-size:16px;
  line-height:1;
  padding:0;
}
.sticky-menu-button:hover{background:rgba(0,0,0,.2)}
.sticky-note-menu{
  position:absolute;
  top:38px;
  right:8px;
  display:none;
  flex-direction:column;
  gap:4px;
  background:#fff;
  border:1px solid rgba(0,0,0,.12);
  border-radius:10px;
  box-shadow:0 8px 18px rgba(0,0,0,.12);
  padding:6px;
  min-width:130px;
  z-index:5;
}
.sticky-note-menu.show{display:flex}
.sticky-note-menu button{
  margin:0;
  padding:7px 10px;
  border-radius:8px;
  border:none;
  background:#f6f6f6;
  color:#333;
  font-size:13px;
  text-align:left;
  cursor:pointer;
}
.sticky-note-menu button:hover{background:#ececec}
.sticky-item.removing{transform:translateX(-220px);opacity:0}
.empty-state{
  text-align:center;
  color:rgba(47,59,74,.8);
  font-size:15px;
  padding:12px;
}

@media (max-width:480px){
  .sticky-section{max-width:100%}
}
</style>
</head>
<body>

<div class="sticky-section">
  <div class="sticky-note-box">
    <p>Notes</p>
    <textarea id="noteInput" rows="3" placeholder="Write a note..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); saveNoteFromInput();}"></textarea>
    <div class="color-picker-row">
      <button class="color-pill yellow active" onclick="setNoteColor('yellow')" type="button" aria-label="Select Yellow Color"></button>
      <button class="color-pill pink" onclick="setNoteColor('pink')" type="button" aria-label="Select Pink Color"></button>
      <button class="color-pill blue" onclick="setNoteColor('blue')" type="button" aria-label="Select Blue Color"></button>
      <button class="color-pill green" onclick="setNoteColor('green')" type="button" aria-label="Select Green Color"></button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Search notes..." oninput="renderNotes()" aria-label="Search notes">
    <div class="button-group">
      <button class="add-note-btn" onclick="saveNoteFromInput()">Add Note</button>
      <button class="add-note-btn secondary" onclick="saveNotesToPdf()">Download All Notes (PDF)</button>
      <button class="add-note-btn danger" onclick="clearAllNotes()">Clear All Notes</button>
    </div>
  </div>
  <div id="stickyList" class="sticky-list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const STORAGE_KEY = 'weatherStickyNotes';
const availableColors = ['yellow', 'pink', 'blue', 'green'];
const colorHexMap = { yellow: '#fff59d', pink: '#f8c8dc', blue: '#cfe8ff', green: '#d8f5d0' };
const colorRgbMap = {
  yellow: [255, 245, 157],
  pink: [248, 200, 220],
  blue: [207, 232, 255],
  green: [216, 245, 208]
};
let selectedNoteColor = 'yellow';

function escapeHtml(text){
  if(!text) return '';
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function getNotes(){
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch (e) {
    console.error('Failed to parse notes from storage:', e);
    return [];
  }
}

function saveNotes(notes){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  } catch (e) {
    console.error('Failed to save notes to storage:', e);
  }
}

function setNoteColor(color){
  selectedNoteColor = color;
  document.querySelectorAll('.color-pill').forEach(btn => btn.classList.toggle('active', btn.classList.contains(color)));
  const input = document.getElementById('noteInput');
  if(input){
    input.dataset.color = color;
    input.style.backgroundColor = colorHexMap[color] || colorHexMap.yellow;
  }
}

function renderNotes(){
  const list = document.getElementById('stickyList');
  const notes = getNotes();
  const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  const filteredNotes = searchQuery ? notes.filter(n => (n.text || '').toLowerCase().includes(searchQuery)) : notes;

  if(!filteredNotes.length){
    list.innerHTML = `<div class="empty-state">${searchQuery ? 'No notes matched your search.' : 'No notes yet. Create your first note above!'}</div>`;
    return;
  }

  list.innerHTML = filteredNotes.map(note => `
  <div class="sticky-item" data-id="${note.id}" data-color="${note.color || 'yellow'}">
    <button class="sticky-menu-button" type="button" onclick="event.stopPropagation(); toggleNoteMenu(${note.id});" aria-label="Note options">⋯</button>
    <div class="sticky-note-menu" id="noteMenu-${note.id}">
      <button type="button" onclick="event.stopPropagation(); changeNoteColor(${note.id});">Change Color</button>
      <button type="button" onclick="event.stopPropagation(); downloadNoteAsPdf(${note.id});">Download PDF</button>
      <button type="button" onclick="event.stopPropagation(); downloadNoteAsText(${note.id});">Download TXT</button>
      <button type="button" onclick="event.stopPropagation(); removeNote(${note.id});">Remove</button>
    </div>
    <div class="sticky-note-text" contenteditable="true" onblur="updateNote(${note.id}, this.innerText)">${escapeHtml(note.text)}</div>
  </div>`).join('');
}

function changeNoteColor(id){
  const notes = getNotes();
  const updated = notes.map(note => {
    if(note.id === id){
      const currentIndex = availableColors.indexOf(note.color || 'yellow');
      const nextColor = availableColors[(currentIndex + 1) % availableColors.length];
      return { ...note, color: nextColor };
    }
    return note;
  });
  saveNotes(updated);
  renderNotes();
}

function updateNote(id, text){
  const trimmedText = (text || '').trim();
  const notes = getNotes();
  const updated = notes.map(note => note.id === id ? { ...note, text: trimmedText || 'Empty note' } : note);
  saveNotes(updated);
}

function toggleNoteMenu(id){
  const menu = document.getElementById(`noteMenu-${id}`);
  if(!menu) return;
  document.querySelectorAll('.sticky-note-menu').forEach(item => {
    if(item !== menu) item.classList.remove('show');
  });
  menu.classList.toggle('show');
}

function downloadNoteAsText(id){
  const notes = getNotes();
  const note = notes.find(item => item.id === id);
  if(!note) return;
  const content = note.text || 'Empty note';
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `sticky-note-${id}.txt`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

function downloadNoteAsPdf(id){
  const notes = getNotes();
  const note = notes.find(item => item.id === id);
  if(!note) return;
  if(!window.jspdf){
    alert('PDF library could not be loaded. Please try again.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a5' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 28;
  const boxWidth = pageWidth - margin * 2;
  const [r, g, b] = colorRgbMap[note.color] || colorRgbMap.yellow;
  const text = note.text || 'Empty note';
  const lines = doc.splitTextToSize(text, boxWidth - 30);
  const boxHeight = Math.max(90, 36 + lines.length * 15 + 24);

  doc.setFillColor(r, g, b);
  doc.setDrawColor(120, 120, 120);
  doc.setLineWidth(0.5);
  doc.roundedRect(margin, margin + 20, boxWidth, boxHeight, 8, 8, 'FD');

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.setTextColor(0, 0, 0);
  doc.text(lines, margin + 15, margin + 44);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(80, 80, 80);
  doc.text(`Created: ${note.createdAt || 'Unknown'}`, margin + 15, margin + 20 + boxHeight - 12);

  doc.save(`sticky-note-${id}.pdf`);
}

function addNote(text = 'New note', color = selectedNoteColor){
  const notes = getNotes();
  notes.unshift({
    id: Date.now(),
    text: (text || '').trim() || 'New note',
    color,
    createdAt: new Date().toLocaleString()
  });
  saveNotes(notes.slice(0, 50));
  renderNotes();
}

function saveNoteFromInput(){
  const input = document.getElementById('noteInput');
  if(!input || !input.value.trim()) return;
  addNote(input.value, selectedNoteColor);
  input.value = '';
}

function saveNotesToPdf(){
  const notes = getNotes();
  if(!window.jspdf){
    alert('PDF library could not be loaded. Please try again.');
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 36;
  const contentWidth = pageWidth - margin * 2;
  const boxWidth = Math.min(contentWidth * 0.85, 360);
  const boxX = margin + (contentWidth - boxWidth) / 2;

  let y = 50;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(20);
  doc.setTextColor(0, 0, 0);
  doc.text('Sticky Notes', margin, y);
  y += 24;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(90, 90, 90);
  doc.text(`Generated on ${new Date().toLocaleString()}`, margin, y);
  y += 24;
  doc.setTextColor(0, 0, 0);

  if(!notes.length){
    doc.setFontSize(12);
    doc.text('No notes yet.', margin, y);
    doc.save('sticky-notes.pdf');
    return;
  }

  notes.forEach((note) => {
    const text = note.text || 'Empty note';
    const [r, g, b] = colorRgbMap[note.color] || colorRgbMap.yellow;
    const lines = doc.splitTextToSize(text, boxWidth - 28);
    const boxHeight = Math.max(80, 26 + lines.length * 14 + 20);

    if(y + boxHeight > pageHeight - margin){
      doc.addPage();
      y = 50;
    }

    doc.setFillColor(r, g, b);
    doc.setDrawColor(120, 120, 120);
    doc.setLineWidth(0.5);
    doc.roundedRect(boxX, y, boxWidth, boxHeight, 8, 8, 'FD');
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.setTextColor(0, 0, 0);
    doc.text(lines, boxX + 14, y + 22);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(80, 80, 80);
    doc.text(`Created: ${note.createdAt || 'Unknown'}`, boxX + 14, y + boxHeight - 10);
    doc.setTextColor(0, 0, 0);
    y += boxHeight + 14;
  });

  doc.save('sticky-notes.pdf');
}

function removeNote(id){
  const noteElement = document.querySelector(`.sticky-item[data-id="${id}"]`);
  const executeRemoval = () => {
    const notes = getNotes();
    const updated = notes.filter(note => note.id !== id);
    saveNotes(updated);
    renderNotes();
  };

  if(noteElement){
    noteElement.classList.add('removing');
    setTimeout(executeRemoval, 350);
  } else {
    executeRemoval();
  }
}

function clearAllNotes(){
  const notes = getNotes();
  if(!notes.length) return;
  if(confirm('Are you sure you want to delete all sticky notes?')){
    saveNotes([]);
    renderNotes();
  }
}

// Close menu when clicking outside
document.addEventListener('click', () => {
  document.querySelectorAll('.sticky-note-menu').forEach(menu => menu.classList.remove('show'));
});

// Initialize default state
setNoteColor('yellow');
renderNotes();
</script>
</body>
</html>
